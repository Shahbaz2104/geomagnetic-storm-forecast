[project]
name = "geomag-forecast"
version = "0.1.0"
description = "Next-day geomagnetic storm risk benchmark from solar + geomagnetic indices"
readme = "README.md"
license = "MIT"
authors = [{ name = "Shahbaz" }]
requires-python = ">=3.10"
keywords = [
    "space-weather",
    "geomagnetic-storm",
    "time-series",
    "machine-learning",
    "streamlit",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "scikit-learn>=1.4",
    "streamlit>=1.64.0",
    "plotly>=7.1.0",
]

[project.urls]
Repository = "https://github.com/Shahbaz2104/geomagnetic-storm-forecast"

[project.scripts]
forecast = "geomag_forecast.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geomag_forecast"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
