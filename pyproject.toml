[project]
name = "geomag-forecast"
version = "0.1.0"
description = "Next-day geomagnetic storm risk benchmark from solar + geomagnetic indices"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "scikit-learn>=1.4",
]

[project.scripts]
forecast = "geomag_forecast.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geomag_forecast"]
